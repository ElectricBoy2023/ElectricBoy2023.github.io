<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winverse App Store</title><style>body{margin:0;background:#090909;color:#eee;font:15px system-ui}header{padding:22px;position:sticky;top:0;background:#111;border-bottom:1px solid #333}main{max-width:1100px;margin:auto;padding:25px}input,select,button{background:#181818;color:#eee;border:1px solid #444;border-radius:9px;padding:10px;margin:4px}input{width:min(420px,80%)}#apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px}.card{border:1px solid #333;border-radius:15px;padding:16px;background:#121212}.card h2{margin:0 0 8px}.source{color:#0f6}.desc{color:#bbb;min-height:70px}.card a{display:block;text-align:center;background:#0f6;color:#000;text-decoration:none;font-weight:bold;padding:9px;border-radius:8px}</style></head><body><header><b>Winverse App Store</b><br><input id="q" placeholder="Search apps..."><select id="src"><option value="all">All sources</option></select><button onclick="load()">Refresh</button></header><main><p id="status">Loading...</p><section id="apps"></section></main><script>let A=[],S=[];const $=x=>document.querySelector(x);const clean=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));async function get(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}function add(x){if(x.name&&x.download)A.push(x)}async function fdroid(s){let d=await get(s.url);for(let [pkg,v] of Object.entries(d.apps||{})){let ver=v.currentVersion||{},id=ver.versionId;if(!id)continue;let z=(v.versions||{})[id],f=z?.file?.name;if(!f)continue;let b=s.url.replace(/\/[^/]+$/,'/');add({name:v.name||pkg,description:v.summary||v.description,version:ver.versionName||id,source:s.name,download:b+f,details:'https://f-droid.org/packages/'+encodeURIComponent(pkg)})}}async function github(s){let d=await get('https://api.github.com/repos/'+s.repo+'/releases?per_page='+(s.releases||3));for(let r of d)for(let a of r.assets||[])if(a.name.toLowerCase().endsWith('.apk'))add({name:s.appName||s.repo.split('/')[1],description:'GitHub release APK',version:r.tag_name,source:s.name,download:a.browser_download_url,details:r.html_url})}async function load(){A=[];try{S=await get('sources.json')}catch(e){$('status').textContent='Could not load sources.json';return}$('#src').innerHTML='<option value="all">All sources</option>'+S.map((s,i)=>'<option value="'+i+'">'+clean(s.name)+'</option>').join('');let r=await Promise.allSettled(S.map(s=>s.type==='fdroid'?fdroid(s):github(s)));render();$('status').textContent=A.length+' apps loaded';}function render(){let q=$('#q').value.toLowerCase(),f=$('#src').value;let x=A.filter(a=>(f==='all'||a.source===S[+f]?.name)&&(a.name.toLowerCase().includes(q)||String(a.description).toLowerCase().includes(q)));$('#apps').innerHTML=x.length?x.map(a=>'<article class="card"><h2>'+clean(a.name)+'</h2><div class="source">'+clean(a.source)+'</div><p class="desc">'+clean(a.description)+'</p><small>'+clean(a.version||'')+'</small><br><br><a href="'+clean(a.download)+'">Download</a></article>').join(''):'<p>No matching apps.</p>'}$('#q').oninput=render;load();</script></body></html>
