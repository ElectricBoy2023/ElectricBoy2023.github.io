<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WinverseTube</title><meta name="theme-color" content="#0f0f0f"><style>
:root{color-scheme:dark;--bg:#0b0b0d;--panel:#141416;--panel2:#1c1c20;--text:#f5f5f5;--muted:#a7a7ad;--accent:#ff0033;--border:#29292f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input{font:inherit}button{border:0;color:inherit;background:transparent;cursor:pointer}.top{height:64px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#0b0b0df2;backdrop-filter:blur(16px);z-index:5}.logo{font-weight:900;font-size:20px}.logo span{color:var(--accent)}.search{display:flex;flex:1;max-width:720px;margin:auto}.search input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:24px 0 0 24px;padding:12px 18px;outline:none}.search button{width:58px;background:var(--panel2);border:1px solid var(--border);border-left:0;border-radius:0 24px 24px 0}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}aside{padding:18px 12px;border-right:1px solid var(--border);position:sticky;top:64px;height:calc(100vh - 64px)}nav button{width:100%;text-align:left;padding:12px 14px;border-radius:10px;margin-bottom:4px}nav button:hover,nav button.active{background:var(--panel2)}main{padding:28px;max-width:1500px;width:100%;margin:auto}.hero{background:linear-gradient(135deg,#18181d,#101014);border:1px solid var(--border);border-radius:18px;padding:28px;margin-bottom:28px}.hero h1{font-size:clamp(28px,5vw,56px);margin:0 0 8px}.hero p,.meta{color:var(--muted)}.section{display:flex;align-items:center;justify-content:space-between;margin:24px 0 14px}.section h2{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}.card{min-width:0;cursor:pointer}.thumb{aspect-ratio:16/9;background:var(--panel);border-radius:12px;overflow:hidden;border:1px solid var(--border)}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.title{font-weight:700;line-height:1.3;margin-top:9px}.meta{font-size:13px;margin-top:5px}.watch{max-width:1200px;margin:auto}.player{background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9}.player video{width:100%;height:100%;display:block}.info h1{font-size:clamp(20px,3vw,34px)}.pill{display:inline-block;padding:9px 14px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;color:inherit;text-decoration:none}.status{color:var(--muted);padding:40px;text-align:center}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:16px}.top{padding:0 10px}.logo{font-size:17px}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}}
</style></head><body><div class="app"><header class="top"><div class="logo">Winverse<span>Tube</span></div><form class="search" id="search"><input id="q" placeholder="Search videos..." autocomplete="off"><button>⌕</button></form><button class="pill" id="full">⛶</button></header><div class="layout"><aside><nav><button class="active" data-page="home">🏠 Home</button><button data-page="trending">🔥 Trending</button><button data-page="search">🔎 Search</button></nav></aside><main id="main"></main></div></div><script>
const instances=['https://yewtu.be','https://inv.nadeko.net','https://invidious.nerdvpn.de','https://invidious.privacydev.net'];
const proxies=[u=>`https://corsproxy.io/?url=${encodeURIComponent(u)}`,u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`];
const main=document.getElementById('main');
async function json(url){const r=await fetch(url,{headers:{accept:'application/json'}});if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.json()}
async function get(path){let last='unknown error';for(const base of instances){try{return await json(base+path)}catch(e){last=e.message}for(const p of proxies){try{return await json(p(base+path))}catch(e){last=e.message}}}throw Error('No API route worked. Last error: '+last)}
function thumb(v){return v.videoId?`https://i.ytimg.com/vi/${encodeURIComponent(v.videoId)}/mqdefault.jpg`:''}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cards(items=[]){return `<div class="grid">${items.map(v=>`<article class="card" onclick="watch('${encodeURIComponent(v.videoId||'')}')"><div class="thumb"><img loading="lazy" src="${esc(thumb(v))}" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${encodeURIComponent(v.videoId||'')}/hqdefault.jpg'" alt=""></div><div class="title">${esc(v.title)}</div><div class="meta">${esc(v.author||'')}${v.viewCount!=null?' · '+Number(v.viewCount).toLocaleString()+' views':''}</div></article>`).join('')}</div>`}
async function home(){main.innerHTML='<div class="hero"><h1>WinverseTube</h1><p>A clean, ad-free frontend powered by Invidious.</p></div><div class="status">Loading...</div>';try{const d=await get('/api/v1/popular');main.innerHTML='<div class="hero"><h1>WinverseTube</h1><p>Watch videos without the clutter.</p></div><div class="section"><h2>Popular</h2></div>'+cards(d.slice(0,24))}catch(e){main.innerHTML=`<div class="status">${esc(e.message)}<br><br><button class="pill" onclick="home()">Retry</button></div>`}}
async function trending(){main.innerHTML='<div class="status">Loading trending...</div>';try{const d=await get('/api/v1/trending');main.innerHTML='<div class="section"><h2>🔥 Trending</h2></div>'+cards(d)}catch(e){main.innerHTML=`<div class="status">${esc(e.message)}<br><br><button class="pill" onclick="trending()">Retry</button></div>`}}
async function search(q){if(!q)return home();main.innerHTML='<div class="status">Searching...</div>';try{const d=await get('/api/v1/search?q='+encodeURIComponent(q));main.innerHTML=`<div class="section"><h2>Results for “${esc(q)}”</h2></div>`+cards(d.filter(x=>x.type==='video'))}catch(e){main.innerHTML=`<div class="status">${esc(e.message)}<br><br><button class="pill" onclick="search(document.getElementById('q').value)">Retry</button></div>`}}
async function watch(id){const vid=decodeURIComponent(id);main.innerHTML='<div class="watch"><div class="status">Loading video...</div></div>';try{const d=await get('/api/v1/videos/'+encodeURIComponent(vid));const formats=[...(d.formatStreams||[])].filter(x=>x.url&&/^video\/mp4/i.test(x.type||''));formats.sort((a,b)=>(parseInt(b.resolution)||0)-(parseInt(a.resolution)||0));const f=formats[0];main.innerHTML=`<div class="watch"><div class="player"><video controls playsinline preload="metadata" src="${esc(f?.url||'')}"></video></div><div class="info"><h1>${esc(d.title)}</h1><div class="meta">${esc(d.author||'')} · ${Number(d.viewCount||0).toLocaleString()} views</div><p>${esc(d.description||'').slice(0,1000)}</p>${f?.url?`<a class="pill" download href="${esc(f.url)}">⬇ Download available stream</a>`:''}</div><div class="section"><h2>Related</h2></div>${cards(d.recommendedVideos||[])}</div>`}catch(e){main.innerHTML=`<div class="status">${esc(e.message)}<br><br><button class="pill" onclick="watch('${id}')">Retry</button></div>`}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');({home,trending,search:()=>search(document.getElementById('q').value.trim())})[b.dataset.page]()});document.getElementById('search').onsubmit=e=>{e.preventDefault();search(document.getElementById('q').value.trim())};document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();home();
</script></body></html>
