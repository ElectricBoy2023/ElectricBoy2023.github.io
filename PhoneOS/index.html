<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101116">
<title>VerseOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Google Sans",system-ui,sans-serif;background:#090a0e;color:#fff}button,input,textarea{font:inherit}button{border:0;color:inherit}#os{position:fixed;inset:0;overflow:hidden;background:var(--wall);background-size:cover;background-position:center;transition:background .6s ease;color:var(--fg)}#os:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0007,#0001 35%,#0006);pointer-events:none}.material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;font-size:25px}.status{position:absolute;z-index:30;top:0;left:0;right:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:5px 17px;font-size:13px;font-weight:600;text-shadow:0 1px 6px #000}.status .right{display:flex;gap:8px;align-items:center}.notch{position:absolute;z-index:31;top:0;left:50%;transform:translateX(-50%);height:27px;background:#050609;border-radius:0 0 18px 18px;box-shadow:0 2px 15px #0008;transition:all .4s cubic-bezier(.2,.8,.2,1)}.notch[data-style=notch]{width:142px}.notch[data-style=pro]{width:190px;height:31px;border-radius:0 0 19px 19px}.notch[data-style=none]{display:none}.home{position:absolute;inset:34px 0 0;display:flex;flex-direction:column;justify-content:space-between;padding:28px 18px 18px;transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .45s}.date{font-size:17px;font-weight:600;text-shadow:0 2px 14px #000}.clock{font-size:64px;line-height:1;font-weight:500;letter-spacing:-3px;text-shadow:0 3px 22px #0008}.widgets{display:flex;gap:10px}.widget,.dock{background:#ffffff1b;border:1px solid #ffffff28;backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);box-shadow:0 10px 30px #0003, inset 0 1px #fff2;border-radius:25px}.widget{padding:13px 15px;flex:1}.widget small{opacity:.7}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 15px;max-width:500px;width:100%;margin:auto auto 20px}.appicon{background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-shadow:0 2px 8px #000}.icon{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;background:#ffffff22;border:1px solid #ffffff22;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 20px #0004,inset 0 1px #fff3;transition:transform .18s ease}.appicon:active .icon{transform:scale(.86)}.dock{padding:10px;display:flex;justify-content:space-around;gap:8px;margin:0 auto;width:min(92%,420px)}.dock button{background:transparent;padding:8px;border-radius:18px}.dock button:active{background:#fff2}.shade{position:absolute;z-index:50;inset:0;background:#08090dcc;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);transform:translateY(-105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding:52px 18px 20px;overflow:auto}.shade.open{transform:none}.qs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.q{padding:16px;border-radius:22px;background:#ffffff16;border:1px solid #ffffff25;text-align:left}.q.on{background:var(--accent);color:#101116}.panel{position:absolute;z-index:60;inset:0;background:#0b0c11eF;backdrop-filter:blur(35px) saturate(140%);-webkit-backdrop-filter:blur(35px) saturate(140%);transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}.panel.open{transform:none}.bar{height:70px;padding:27px 16px 8px;display:flex;align-items:center;gap:8px;flex-shrink:0}.bar h2{margin:0;font-size:23px}.back{width:42px;height:42px;border-radius:50%;background:#fff1}.content{padding:0 16px 30px;overflow:auto}.card{background:#ffffff0d;border:1px solid #ffffff17;border-radius:24px;margin:12px 0;overflow:hidden}.row{display:flex;align-items:center;gap:13px;padding:16px;border-bottom:1px solid #fff1;min-height:60px}.row:last-child{border:0}.row .grow{flex:1}.row small{opacity:.65;display:block;margin-top:3px}.switch{width:48px;height:28px;border-radius:20px;background:#555;position:relative;transition:.25s}.switch:after{content:"";position:absolute;width:22px;height:22px;top:3px;left:3px;border-radius:50%;background:#fff;transition:.25s}.switch.on{background:var(--accent)}.switch.on:after{left:23px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{padding:9px 12px;border-radius:14px;background:#fff1}.choice.sel{background:var(--accent);color:#111}.wall{height:70px;width:70px;border-radius:17px;border:2px solid transparent;background-size:cover;background-position:center}.wall.sel{border-color:var(--accent)}.sheet{position:absolute;z-index:70;left:10px;right:10px;bottom:10px;background:#15161ceF;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid #fff2;border-radius:28px;padding:16px;transform:translateY(120%);transition:.35s;box-shadow:0 20px 60px #0008}.sheet.open{transform:none}.sheet h3{margin:3px 0 14px}.input{width:100%;background:#fff0;border:1px solid #fff2;color:inherit;border-radius:15px;padding:12px 14px;outline:none}.input:focus{border-color:var(--accent)}.bigbtn{width:100%;padding:13px;border-radius:16px;background:var(--accent);color:#111;font-weight:600;margin-top:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.calc button{height:64px;border-radius:20px;background:#ffffff12;font-size:22px}.calc button:active{background:#fff3}.display{font-size:45px;text-align:right;padding:22px 8px;overflow:hidden;white-space:nowrap}.note{background:#ffffff0d;border:1px solid #fff2;border-radius:18px;padding:14px;margin:9px 0}.note strong{display:block}.toast{position:absolute;z-index:100;left:50%;bottom:30px;transform:translate(-50%,30px);opacity:0;background:#222b;border:1px solid #fff2;backdrop-filter:blur(20px);padding:12px 17px;border-radius:18px;transition:.3s;pointer-events:none}.toast.show{transform:translate(-50%,0);opacity:1}.launch{animation:launch .42s both}@keyframes launch{from{opacity:0;transform:scale(.92) translateY(20px)}to{opacity:1;transform:none}}@media(min-width:700px){.home{max-width:520px;margin:auto}.panel{left:50%;width:520px;transform:translate(-50%,105%);border-left:1px solid #fff2;border-right:1px solid #fff2}.panel.open{transform:translate(-50%,0)}}
</style>
</head>
<body><main id="os"><div class="status"><span id="statusTime">20:00</span><span class="right"><span class="material-symbols-rounded">signal_cellular_alt</span><span class="material-symbols-rounded">wifi</span><span class="material-symbols-rounded">battery_full</span></span></div><div id="notch" class="notch" data-style="notch"></div><section class="home" id="home"><div><div class="date" id="date"></div><div class="clock" id="clock"></div></div><div class="widgets"><div class="widget"><small>Weather</small><br>☀️ 22°C</div><div class="widget"><small>Battery</small><br><span id="batteryText">--%</span></div></div><div class="apps" id="apps"></div><div class="dock"><button onclick="openApp('Phone')"><span class="material-symbols-rounded">call</span></button><button onclick="openApp('Messages')"><span class="material-symbols-rounded">chat_bubble</span></button><button onclick="openApp('Browser')"><span class="material-symbols-rounded">language</span></button><button onclick="openApp('Settings')"><span class="material-symbols-rounded">settings</span></button></div></section><section class="shade" id="shade"><h2>Quick controls</h2><p id="shadeDate"></p><div class="qs"><button class="q on" id="wifiQ" onclick="toggleQ(this)">Wi‑Fi<br><small>Connected</small></button><button class="q" onclick="toggleQ(this)">Bluetooth<br><small>Off</small></button><button class="q" onclick="toggleQ(this)">Airplane mode<br><small>Off</small></button><button class="q on" onclick="toggleQ(this)">Auto brightness<br><small>On</small></button></div><button class="bigbtn" onclick="closeShade()">Done</button></section><section class="panel" id="panel"><div class="bar"><button class="back" onclick="closeApp()"><span class="material-symbols-rounded">arrow_back</span></button><h2 id="panelTitle"></h2></div><div class="content" id="content"></div></section><div class="sheet" id="sheet"></div><div class="toast" id="toast"></div></main>
<script>
const $=s=>document.querySelector(s), KEY='verseos-state';
const icons={Phone:'call',Contacts:'contacts',Messages:'chat',Calculator:'calculate',Clock:'schedule',Calendar:'calendar_month',Notes:'edit_note',Gallery:'photo_library',Files:'folder',Browser:'language',Settings:'settings'};
const apps=['Phone','Contacts','Messages','Calculator','Clock','Calendar','Notes','Gallery','Files','Browser','Settings'];
const defaults={theme:'dark',accent:'#b9c7ff',notch:'notch',wallpaper:'aurora',notes:[],contacts:[],messages:[],events:[]};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||defaults; state={...defaults,...state};
const walls={aurora:'radial-gradient(circle at 25% 15%,#7045c8,transparent 35%),radial-gradient(circle at 80% 70%,#087f9d,transparent 38%),linear-gradient(145deg,#11152b,#05080e)',sunset:'linear-gradient(145deg,#301548,#b14f67 45%,#f0a45a)',ocean:'radial-gradient(circle at 70% 20%,#29a7c7,transparent 35%),linear-gradient(150deg,#061a3a,#041013)',midnight:'radial-gradient(circle at 50% 10%,#36446b,transparent 25%),linear-gradient(#070912,#020205)',forest:'radial-gradient(circle at 25% 30%,#28794f,transparent 30%),linear-gradient(145deg,#071d16,#06100c)'};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function apply(){document.documentElement.style.setProperty('--accent',state.accent);document.documentElement.style.setProperty('--wall',walls[state.wallpaper]||walls.aurora);document.documentElement.style.setProperty('--fg',state.theme==='light'?'#15161a':'#fff');document.documentElement.style.setProperty('--accent',state.accent);$('#notch').dataset.style=state.notch;document.body.classList.toggle('light',state.theme==='light');if(state.theme==='light'){$('#os').style.setProperty('--wall',walls[state.wallpaper]);$('#os').style.color='#16171b'}else $('#os').style.color='#fff'}
function tick(){let d=new Date();let t=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});$('#clock').textContent=t;$('#statusTime').textContent=t;$('#date').textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});$('#shadeDate').textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});navigator.getBattery?.().then(b=>$('#batteryText').textContent=Math.round(b.level*100)+'%').catch(()=>$('#batteryText').textContent='Ready')}setInterval(tick,1000);tick();apply();
function renderApps(){let a=$('#apps');a.innerHTML=apps.map(x=>`<button class="appicon" onclick="openApp('${x}')"><span class="icon"><span class="material-symbols-rounded">${icons[x]}</span></span>${x}</button>`).join('')}renderApps();
function openApp(name){$('#panelTitle').textContent=name;$('#panel').classList.add('open','launch');render(name);setTimeout(()=>$('#panel').classList.remove('launch'),500)}function closeApp(){$('#panel').classList.remove('open')}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function render(name){let c=$('#content'); if(name==='Settings')return settings(c);if(name==='Calculator')return calculator(c);if(name==='Notes')return notes(c);if(name==='Contacts')return contacts(c);if(name==='Messages')return messages(c);if(name==='Calendar')return calendar(c);if(name==='Clock')return clock(c);if(name==='Phone')return phone(c);if(name==='Gallery')return gallery(c);if(name==='Files')return files(c);if(name==='Browser')return browser(c)}
function settings(c){c.innerHTML=`<div class="card"><div class="row"><span class="material-symbols-rounded">palette</span><div class="grow"><b>Theme</b><small>Choose the OS appearance</small></div><div class="choices"><button class="choice ${state.theme==='dark'?'sel':''}" onclick="setTheme('dark')">Dark</button><button class="choice ${state.theme==='light'?'sel':''}" onclick="setTheme('light')">Light</button></div></div><div class="row"><span class="material-symbols-rounded">crop_16_9</span><div class="grow"><b>Notch</b><small>Display cutout style</small></div><div class="choices"><button class="choice ${state.notch==='notch'?'sel':''}" onclick="setNotch('notch')">Notch</button><button class="choice ${state.notch==='pro'?'sel':''}" onclick="setNotch('pro')">Pro Notch</button><button class="choice ${state.notch==='none'?'sel':''}" onclick="setNotch('none')">No Notch</button></div></div><div class="row"><span class="material-symbols-rounded">colorize</span><div class="grow"><b>Accent</b><small>UI highlight color</small></div><input type="color" value="${state.accent}" onchange="state.accent=this.value;save();apply();render('Settings')"></div></div><div class="card"><div class="row"><b>Wallpaper</b></div><div class="row"><div class="choices">${Object.keys(walls).map(w=>`<button class="wall ${state.wallpaper===w?'sel':''}" style="background:${walls[w]}" onclick="state.wallpaper='${w}';save();apply();render('Settings')" aria-label="${w}"></button>`).join('')}</div></div></div><div class="card"><div class="row"><span class="material-symbols-rounded">info</span><div class="grow"><b>VerseOS</b><small>Touch-first web phone OS • settings persist locally</small></div></div></div>`}
function setTheme(x){state.theme=x;save();apply();render('Settings')}function setNotch(x){state.notch=x;save();apply();render('Settings')}
function calculator(c){let v='0';c.innerHTML=`<div class="card"><div class="display" id="calcDisplay">0</div></div><div class="calc">${['C','⌫','÷','×','7','8','9','−','4','5','6','+','1','2','3','=','0','.'].map(x=>`<button onclick="calc('${x}')">${x}</button>`).join('')}</div>`;window.calc=function(x){let d=$('#calcDisplay');if(x==='C')d.textContent='0';else if(x==='⌫')d.textContent=d.textContent.length>1?d.textContent.slice(0,-1):'0';else if(x==='='){try{let s=d.textContent.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-');d.textContent=String(Function('return '+s)())}catch{d.textContent='Error'}}else d.textContent=d.textContent==='0'&&/[0-9.]/.test(x)?x:d.textContent+x}}
function notes(c){c.innerHTML=`<button class="bigbtn" onclick="addNote()">+ New note</button>${state.notes.map((n,i)=>`<div class="note"><strong>${esc(n.title||'Untitled')}</strong><p>${esc(n.body)}</p><button class="choice" onclick="editNote(${i})">Edit</button> <button class="choice" onclick="state.notes.splice(${i},1);save();notes($('#content'))">Delete</button></div>`).join('')||'<p style="opacity:.6">No notes yet.</p>'}`}
function addNote(i=null){let n=i==null?{title:'',body:''}:state.notes[i];$('#sheet').innerHTML=`<h3>${i==null?'New note':'Edit note'}</h3><input class="input" id="nt" placeholder="Title" value="${esc(n.title)}"><textarea class="input" id="nb" style="margin-top:8px;height:130px" placeholder="Write something...">${esc(n.body)}</textarea><button class="bigbtn" onclick="let x={title:$('#nt').value,body:$('#nb').value};${i==null?'state.notes.push(x)':'state.notes['+i+']=x'};save();$('#sheet').classList.remove('open');notes($('#content'))">Save</button>`;$('#sheet').classList.add('open')}function editNote(i){addNote(i)}
function contacts(c){c.innerHTML=`<button class="bigbtn" onclick="addContact()">+ Add contact</button>${state.contacts.map((x,i)=>`<div class="note"><strong>${esc(x.name)}</strong><p>${esc(x.phone||'No number')}</p><button class="choice" onclick="addContact(${i})">Edit</button> <button class="choice" onclick="state.contacts.splice(${i},1);save();contacts($('#content'))">Delete</button></div>`).join('')||'<p style="opacity:.6">No contacts.</p>'}`}
function addContact(i=null){let x=i==null?{name:'',phone:''}:state.contacts[i];$('#sheet').innerHTML=`<h3>${i==null?'Add contact':'Edit contact'}</h3><input class="input" id="cn" placeholder="Name" value="${esc(x.name)}"><input class="input" id="cp" style="margin-top:8px" placeholder="Phone" value="${esc(x.phone)}"><button class="bigbtn" onclick="let x={name:$('#cn').value,phone:$('#cp').value};${i==null?'state.contacts.push(x)':'state.contacts['+i+']=x'};save();$('#sheet').classList.remove('open');contacts($('#content'))">Save</button>`;$('#sheet').classList.add('open')}
function messages(c){c.innerHTML=`<div class="card">${state.messages.map(m=>`<div class="row"><span class="material-symbols-rounded">account_circle</span><div class="grow"><b>${esc(m.from)}</b><small>${esc(m.text)}</small></div><small>${new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')||'<div class="row">No messages yet.</div>'}</div><button class="bigbtn" onclick="sendMessage()">+ New message</button>`}function sendMessage(){let from=prompt('Contact name','Me');if(from===null)return;let text=prompt('Message');if(text===null)return;state.messages.push({from,text,time:Date.now()});save();messages($('#content'));toast('Message saved')}
function calendar(c){let d=new Date();c.innerHTML=`<div class="card"><div class="row"><div class="grow"><b>${d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})}</b><small>Your local calendar</small></div></div>${state.events.map((e,i)=>`<div class="row"><span class="material-symbols-rounded">event</span><div class="grow"><b>${esc(e.title)}</b><small>${esc(e.date)}</small></div><button class="choice" onclick="state.events.splice(${i},1);save();calendar($('#content'))">Delete</button></div>`).join('')}</div><button class="bigbtn" onclick="addEvent()">+ Add event</button>`}function addEvent(){let title=prompt('Event title');if(!title)return;let date=prompt('Date/time');if(!date)return;state.events.push({title,date});save();calendar($('#content'))}
function clock(c){c.innerHTML=`<div class="card"><div class="display" id="stop">00:00.0</div></div><div class="grid2"><button class="bigbtn" onclick="startStop()">Start / Stop</button><button class="bigbtn" onclick="resetStop()">Reset</button></div>`;let st=0,last=0,timer=null;window.startStop=()=>{if(timer){clearInterval(timer);timer=null}else{last=Date.now();timer=setInterval(()=>{st+=Date.now()-last;last=Date.now();let s=st/1000;$('#stop').textContent=Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toFixed(1).padStart(4,'0')},100)}};window.resetStop=()=>{st=0;$('#stop').textContent='00:00.0'}}
function phone(c){c.innerHTML=`<div class="card"><div class="display" id="dial"> </div></div><div class="calc">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(x=>`<button onclick="$('#dial').textContent+='$${x}'">${x}</button>`).join('')}<button style="grid-column:2/4" onclick="toast('Calling '+($('#dial').textContent||'number'))"><span class="material-symbols-rounded">call</span></button><button onclick="$('#dial').textContent=''">C</button></div>`}
function gallery(c){let imgs=['https://images.unsplash.com/photo-1500534623283-312aade485b7?w=900','https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900','https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=900','https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=900'];c.innerHTML=`<div class="grid2">${imgs.map((x,i)=>`<button class="wall" style="width:100%;height:150px;background-image:url('${x}')" onclick="window.open('${x}','_blank')" aria-label="Photo ${i+1}"></button>`).join('')}</div><p style="opacity:.6">Demo gallery. Images open directly.</p>`}
function files(c){c.innerHTML=`<div class="card">${['Documents','Downloads','Pictures','Music'].map(x=>`<div class="row"><span class="material-symbols-rounded">folder</span><div class="grow"><b>${x}</b><small>Virtual folder</small></div></div>`).join('')}</div><button class="bigbtn" onclick="toast('VerseOS virtual storage is local to this browser')">Storage info</button>`}
function browser(c){c.innerHTML=`<div class="card"><div class="row"><input class="input" id="url" value="https://www.google.com" inputmode="url"><button class="choice" onclick="browse()">Go</button></div></div><iframe id="webview" src="https://www.google.com/search?igu=1" style="width:100%;height:calc(100vh - 170px);border:0;border-radius:22px;background:white"></iframe><p style="opacity:.6">Some sites block iframe embedding. Use the button below to open them normally.</p><button class="bigbtn" onclick="window.open($('#url').value,'_blank')">Open in browser</button>`;window.browse=()=>{let u=$('#url').value.trim();if(!/^https?:\/\//i.test(u))u='https://www.google.com/search?q='+encodeURIComponent(u);$('#webview').src=u}}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toggleQ(e){e.classList.toggle('on')}function closeShade(){$('#shade').classList.remove('open')}
let sy=0;addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});addEventListener('touchend',e=>{let dy=e.changedTouches[0].clientY-sy;if(sy<70&&dy>70&&!$('#panel').classList.contains('open'))$('#shade').classList.add('open');if(dy<-100&&$('#shade').classList.contains('open'))closeShade()},{passive:true});addEventListener('keydown',e=>{if(e.key==='Escape'){$('#panel').classList.remove('open');closeShade();$('#sheet').classList.remove('open')}});
</script></body></html>
